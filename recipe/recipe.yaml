schema_version: 1

context:
  name: newton-usd-schemas
  version: "0.5.0"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace("-", "_")|lower }}-${{ version }}.tar.gz
  sha256: a404232e9f89cfce130ee5ed5c8b6b23b187514e857803b5d7b08568bb2516e0

build:
  noarch: python
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    # This are marked as [dev] dependencies (but imported in the main __init__.py).
    - openusd >=25.11
    - usd-exchange >=2.2
tests:
  - python:
      imports:
        - newton_usd_schemas
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - python -m unittest discover -v -s ./tests
    files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/newton-physics/newton-usd-schemas
  license: Apache-2.0
  license_file: LICENSE.md
  repository: https://github.com/newton-physics/newton-usd-schemas
  summary: OpenUSD Schemas for Newton

extra:
  recipe-maintainers:
    - adenzler-nvidia
    - diegoferigo
    - eric-heiden
