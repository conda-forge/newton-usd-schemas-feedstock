schema_version: 1

context:
  name: newton-usd-schemas
  version: "0.7.0"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace("-", "_")|lower }}-${{ version }}.tar.gz
  sha256: 65722fd89f554be6fa61d4e493c34a54461fd26b2b9dc0e85f19aa6d8ac2978e
  patches:
    # The openusd conda package provides the usd-core Python distribution.
    - use-conda-openusd-metadata.patch

build:
  noarch: python
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    # Conda-forge provides openusd >=25.5 on all supported platforms.
    # It supplies usd-core directly, so the patched Python metadata can use
    # a single minimum version without the usd-exchange fallback.
    - openusd >=25.5
tests:
  - python:
      imports:
        - newton_usd_schemas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v -s ./tests
    files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/newton-physics/newton-usd-schemas
  license: Apache-2.0
  license_file: LICENSE.md
  repository: https://github.com/newton-physics/newton-usd-schemas
  summary: OpenUSD Schemas for Newton

extra:
  recipe-maintainers:
    - adenzler-nvidia
    - diegoferigo
    - eric-heiden
